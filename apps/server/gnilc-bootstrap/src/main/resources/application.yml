server:
  port: 3888
  servlet:
    context-path: /api
spring:
  application:
    name: gnilc-auth
  messages:
    basename: i18n/common/messages,i18n/rbac/messages,i18n/system/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  profiles:
    active: dev
  datasource:
    name: druidDataSource
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.jdbc.Driver
      filters: stat,wall,config
      max-active: 100
      initial-size: 1
      max-wait: 60000
      min-idle: 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: select 'x'
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-open-prepared-statements: 50
      max-pool-prepared-statement-per-connection-size: 20
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      logic-delete-field: del
      logic-delete-value: true
      logic-not-delete-value: false
      id-type: assign_id
logging:
  file:
    name: '${LOG_FILE:logs/${spring.application.name:gnilc-auth}.log}'
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:5GB}
      clean-history-on-start: ${LOG_CLEAN_HISTORY_ON_START:true}
  level:
    root: warn
    com.gnilc: info
app:
  i18n:
    default-locale: en-US
