name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  admin:
    name: Admin tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test admin
        run: pnpm test:admin

      - name: Typecheck admin
        run: pnpm --filter=@app/admin run typecheck

      - name: Build admin
        run: pnpm build:admin

  e2e:
    name: Full-stack browser tests
    needs:
      - admin
      - fast-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Docker
        run: docker info

      - name: Run full-stack browser tests
        run: pnpm test:e2e

      - name: Upload browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  fast-tests:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Surefire tests
        working-directory: apps/server
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-tests-surefire-reports
          path: 'apps/server/**/target/surefire-reports/**'
          if-no-files-found: ignore

  full-verification:
    name: Full verification
    needs: fast-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Maven verify runs Testcontainers integration tests and requires Docker.
      - name: Verify Docker
        run: docker info

      - name: Run full verification
        working-directory: apps/server
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-verification-test-reports
          path: |
            apps/server/**/target/surefire-reports/**
            apps/server/**/target/failsafe-reports/**
          if-no-files-found: ignore
