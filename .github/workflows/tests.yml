name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admin: ${{ steps.classify.outputs.admin }}
      conservative: ${{ steps.classify.outputs.conservative }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      e2e: ${{ steps.classify.outputs.e2e }}
      reason: ${{ steps.classify.outputs.reason }}
      server: ${{ steps.classify.outputs.server }}
      server_full: ${{ steps.classify.outputs.server_full }}
      tooling: ${{ steps.classify.outputs.tooling }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm for version consistency checks
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Check product versions and database manifest
        run: |
          pnpm version:check
          node scripts/release/database.mjs

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          reason=''
          range=''
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              range="${BASE_SHA}...${HEAD_SHA}"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                reason='push before SHA is unavailable'
              else
                range="${BEFORE_SHA}..${HEAD_SHA}"
              fi
              ;;
            *)
              reason="unsupported event: ${GITHUB_EVENT_NAME}"
              ;;
          esac

          if [[ -n "$reason" ]]; then
            node scripts/ci-changes.mjs \
              --event "$GITHUB_EVENT_NAME" \
              --before "$BEFORE_SHA" \
              --uncertain "$reason"
            exit 0
          fi

          diff_file="${RUNNER_TEMP}/ci-name-status"
          if git diff --name-status -z --diff-filter=ACDMRTUXB \
              "$range" > "$diff_file"; then
            node scripts/ci-changes.mjs \
              --event "$GITHUB_EVENT_NAME" \
              --before "$BEFORE_SHA" < "$diff_file"
          else
            node scripts/ci-changes.mjs \
              --event "$GITHUB_EVENT_NAME" \
              --before "$BEFORE_SHA" \
              --uncertain "git diff failed for ${range}"
          fi

  docs:
    name: Documentation checks
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check changed-document whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          else
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          git diff --check "$range"

      - name: Check local Markdown links
        run: node scripts/check-markdown-links.mjs

  admin:
    name: Admin tests, typecheck and build
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Admin
        run: pnpm test:admin

      - name: Typecheck Admin
        run: pnpm --filter=@app/admin run typecheck

      - name: Build Admin
        run: pnpm build:admin

  workspace:
    name: Workspace tests
    needs: changes
    if: ${{ needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run shared and tooling tests
        run: >-
          pnpm exec vitest run --dom packages internal scripts apps/server/scripts

  server:
    name: Server verification
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run fast Server tests
        if: ${{ needs.changes.outputs.server_full != 'true' }}
        working-directory: apps/server
        run: mvn --batch-mode --no-transfer-progress test

      - name: Verify Docker
        if: ${{ needs.changes.outputs.server_full == 'true' }}
        run: docker info

      - name: Run complete Server verification
        if: ${{ needs.changes.outputs.server_full == 'true' }}
        working-directory: apps/server
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload Server test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            apps/server/**/target/surefire-reports/**
            apps/server/**/target/failsafe-reports/**
          if-no-files-found: ignore

  e2e:
    name: Full-stack browser tests
    needs:
      - changes
      - admin
      - workspace
      - server
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.e2e == 'true' &&
        !contains(needs.*.result, 'failure') &&
        !contains(needs.*.result, 'cancelled')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Docker
        run: docker info

      - name: Run full-stack browser tests
        run: pnpm test:e2e

      - name: Upload browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  ci-gate:
    name: CI gate
    needs:
      - changes
      - docs
      - admin
      - workspace
      - server
      - e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Evaluate dependency results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
