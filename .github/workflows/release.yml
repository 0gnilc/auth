name: Release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full commit SHA on main to release (blank uses the workflow commit)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ identity.outputs.version }}
      revision: ${{ identity.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate release identity
        id: identity
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_REVISION" && ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Use a full commit SHA, not a moving branch or tag.' >&2
            exit 1
          fi
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker info
      - run: pnpm release:verify
      - run: pnpm release:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: .release/${{ steps.identity.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: .release/${{ needs.verify.outputs.version }}/
      - name: Publish verified artifacts without overwriting releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_IMMUTABILITY_CONFIRMED: ${{ vars.RELEASE_IMMUTABILITY_CONFIRMED }}
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
        run: node scripts/release/publish.mjs
