name: commit-convention

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-convention:
    name: commit-convention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail

          pattern='^(revert: .+|((feat|fix|docs|style|refactor|perf|test|workflow|build|ci|chore|types|wip)(\([a-z0-9][a-z0-9._-]*\))?: [a-z][^.]?.{0,87}[^.]))$'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags origin "$base_sha" "$head_sha"
            range="$base_sha..$head_sha"
          else
            before_sha="${{ github.event.before }}"
            after_sha="${{ github.sha }}"
            if [[ "$before_sha" =~ ^0+$ ]]; then
              range="$after_sha"
            else
              git fetch --no-tags origin "$before_sha" "$after_sha"
              range="$before_sha..$after_sha"
            fi
          fi

          failed=0
          while IFS= read -r header; do
            [[ -z "$header" ]] && continue
            if ! [[ "$header" =~ $pattern ]]; then
              echo "Invalid commit message: $header"
              failed=1
            fi
          done < <(git log --format=%s "$range")

          if [[ "$failed" -ne 0 ]]; then
            echo
            echo "Commit messages must follow .github/commit-convention.md."
            exit 1
          fi
