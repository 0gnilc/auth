server:
  port: 0
  servlet:
    context-path: /api
spring:
  application:
    name: access-control-example-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${RBAC_TEST_JDBC_URL:jdbc:mysql://localhost:3306/access?useAffectedRows=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
    username: ${RBAC_TEST_DB_USERNAME:root}
    password: ${RBAC_TEST_DB_PASSWORD:12345678}
  data:
    redis:
      host: ${RBAC_TEST_REDIS_HOST:localhost}
      port: ${RBAC_TEST_REDIS_PORT:6379}
      database: ${RBAC_TEST_REDIS_DATABASE:1}
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      logic-delete-field: del
      logic-delete-value: true
      logic-not-delete-value: false
      id-type: assign_id
logging:
  level:
    com.gnilc.authz.rbac.dao: debug
